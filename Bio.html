<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bio Qrcode</title>
    <link rel="stylesheet" href="styles.css" />
    <!-- QRCode library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="script.js" defer></script>
  </head>
  <body>
    <div class="header">
      <div class="box">
        <h1>QR Bio code Generator</h1>

        <hr />
        <div id="qrcode" class="qr-code"></div>
        <input
          type="text"
          id="bioUrlInput"
          placeholder="Paste your bio.html link here"
          oninput="generateBioQR()"
        />
      </div>
    </div>
  </body>
</html>
